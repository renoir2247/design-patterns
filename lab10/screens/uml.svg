<svg xmlns="http://www.w3.org/2000/svg" font-family="Menlo, monospace" font-size="12" width="770" height="480" viewBox="0 0 770 480">
  <rect width="770" height="480" fill="#FFFFFF"/>

  <text x="385" y="26" text-anchor="middle" font-weight="bold">Наблюдатель</text>
  <g>
    <rect x="270" y="45" width="230" height="75" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="385" y="69" text-anchor="middle" font-weight="bold">&#171;Subject&#187;</text>
    <text x="385" y="89" text-anchor="middle" font-weight="bold">BookingEvents</text>
    <line x1="270" y1="97" x2="500" y2="97" stroke="#333"/>
    <text x="280" y="113">+ subscribe(l) / publish(ref, st)</text>
  </g>
  <g>
    <rect x="60" y="190" width="250" height="55" fill="#F3E8FD" stroke="#333" stroke-width="1.5"/>
    <text x="185" y="214" text-anchor="middle" font-weight="bold">&#171;interface&#187;</text>
    <text x="185" y="234" text-anchor="middle" font-weight="bold">BookingListener</text>
  </g>
  <g>
    <rect x="360" y="190" width="170" height="40" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="445" y="216" text-anchor="middle">TicketIssuer</text>
  </g>
  <g>
    <rect x="570" y="190" width="180" height="40" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="660" y="216" text-anchor="middle">NotificationSender</text>
  </g>
  <line x1="185" y1="190" x2="320" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="445" y1="190" x2="385" y2="120" stroke="#333" stroke-width="1.5"/>
  <line x1="660" y1="190" x2="450" y2="120" stroke="#333" stroke-width="1.5"/>
  <polygon points="385,120 399,126 391,136" fill="none" stroke="#333" stroke-width="1.5"/>

  <text x="385" y="280" text-anchor="middle" font-weight="bold">Состояние</text>
  <g>
    <rect x="150" y="300" width="200" height="85" fill="#FDF6E3" stroke="#333" stroke-width="1.5"/>
    <text x="250" y="324" text-anchor="middle" font-weight="bold">&#171;Context&#187;</text>
    <text x="250" y="344" text-anchor="middle" font-weight="bold">Booking</text>
    <line x1="150" y1="352" x2="350" y2="352" stroke="#333"/>
    <text x="160" y="368">- state: BookingState</text>
    <text x="160" y="380">+ pay() / expire()</text>
  </g>
  <g>
    <rect x="430" y="300" width="220" height="60" fill="#F3E8FD" stroke="#333" stroke-width="1.5"/>
    <text x="540" y="324" text-anchor="middle" font-weight="bold">&#171;State&#187;</text>
    <text x="540" y="344" text-anchor="middle" font-weight="bold">BookingState</text>
  </g>
  <g>
    <rect x="390" y="400" width="120" height="35" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="450" y="423" text-anchor="middle">PendingState</text>
  </g>
  <g>
    <rect x="525" y="400" width="130" height="35" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="590" y="423" text-anchor="middle">ConfirmedState</text>
  </g>
  <g>
    <rect x="668" y="400" width="105" height="35" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="720" y="423" text-anchor="middle">ExpiredState</text>
  </g>
  <line x1="650" y1="360" x2="540" y2="360" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="450" y1="400" x2="510" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="590" y1="400" x2="545" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="720" y1="400" x2="575" y2="360" stroke="#333" stroke-width="1.5"/>
  <line x1="350" y1="340" x2="430" y2="330" stroke="#333" stroke-width="1.5"/>
  <polygon points="430,330 418,324 418,336" fill="none" stroke="#333" stroke-width="1.5"/>
</svg>
