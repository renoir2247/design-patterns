<svg xmlns="http://www.w3.org/2000/svg" font-family="Menlo, monospace" font-size="12.5" width="760" height="300" viewBox="0 0 760 300">
  <rect width="760" height="300" fill="#FFFFFF"/>

  <g>
    <rect x="40" y="60" width="200" height="75" fill="#FDF6E3" stroke="#333" stroke-width="1.5"/>
    <text x="140" y="84" text-anchor="middle" font-weight="bold">&#171;View&#187;</text>
    <text x="140" y="104" text-anchor="middle" font-weight="bold">BookingView</text>
    <line x1="40" y1="112" x2="240" y2="112" stroke="#333"/>
    <text x="50" y="126">+ render(ref, status)</text>
  </g>

  <g>
    <rect x="290" y="60" width="200" height="95" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="390" y="84" text-anchor="middle" font-weight="bold">&#171;Controller&#187;</text>
    <text x="390" y="104" text-anchor="middle" font-weight="bold">BookingController</text>
    <line x1="290" y1="114" x2="490" y2="114" stroke="#333"/>
    <text x="300" y="130">- model, view</text>
    <text x="300" y="146">+ displayBooking()</text>
  </g>

  <g>
    <rect x="540" y="60" width="190" height="95" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="635" y="84" text-anchor="middle" font-weight="bold">&#171;Model&#187;</text>
    <text x="635" y="104" text-anchor="middle" font-weight="bold">BookingModel</text>
    <line x1="540" y1="114" x2="730" y2="114" stroke="#333"/>
    <text x="550" y="130">- reference, status</text>
    <text x="550" y="146">+ confirm() {правила}</text>
  </g>

  <line x1="240" y1="90" x2="290" y2="90" stroke="#333" stroke-width="1.5"/>
  <polygon points="240,90 252,84 252,96" fill="#333"/>
  <text x="265" y="80" text-anchor="middle">показ</text>
  <line x1="490" y1="90" x2="540" y2="90" stroke="#333" stroke-width="1.5"/>
  <polygon points="540,90 528,84 528,96" fill="#333"/>
  <text x="515" y="80" text-anchor="middle">обновляет</text>
  <line x1="390" y1="155" x2="390" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="140" y1="135" x2="140" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="635" y1="155" x2="635" y2="200" stroke="#333" stroke-width="1.5"/>
  <line x1="140" y1="200" x2="635" y2="200" stroke="#333" stroke-width="1.5"/>
  <text x="390" y="218" text-anchor="middle">пользователь действует через контроллер</text>
</svg>
