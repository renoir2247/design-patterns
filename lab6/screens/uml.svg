<svg xmlns="http://www.w3.org/2000/svg" font-family="Menlo, monospace" font-size="12.5" width="780" height="470" viewBox="0 0 780 470">
  <rect width="780" height="470" fill="#FFFFFF"/>

  <g>
    <rect x="270" y="30" width="220" height="70" fill="#F3E8FD" stroke="#333" stroke-width="1.5"/>
    <text x="380" y="52" text-anchor="middle" font-weight="bold">&#171;Subject&#187;</text>
    <text x="380" y="72" text-anchor="middle" font-weight="bold">IBookingService</text>
    <line x1="270" y1="82" x2="490" y2="82" stroke="#333"/>
    <text x="280" y="96">+ confirm(ref)</text>
  </g>

  <g>
