    <text x="70" y="268">- inner: BookingServiceImpl</text>
    <text x="70" y="286">+ confirm(ref) {проверка роли}</text>
  </g>

  <g>
    <rect x="440" y="180" width="250" height="75" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
