  </g>

  <line x1="185" y1="180" x2="320" y2="100" stroke="#333" stroke-width="1.5"/>
  <polygon points="320,100 306,104 314,114" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="565" y1="180" x2="450" y2="100" stroke="#333" stroke-width="1.5"/>
  <polygon points="450,100 442,112 456,112" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="310" y1="235" x2="440" y2="225" stroke="#333" stroke-width="1.5"/>
