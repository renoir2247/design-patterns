<svg xmlns="http://www.w3.org/2000/svg" font-family="Menlo, monospace" font-size="12.5" width="780" height="580" viewBox="0 0 780 580">
  <rect width="780" height="580" fill="#FFFFFF"/>

  <!-- Payment (product hierarchy) -->
  <g>
    <rect x="30" y="40" width="220" height="70" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="140" y="62" text-anchor="middle" font-weight="bold">«Product»</text>
    <text x="140" y="82" text-anchor="middle" font-weight="bold">Payment</text>
    <line x1="30" y1="92" x2="250" y2="92" stroke="#333"/>
    <text x="40" y="102">+ describe(): String</text>
  </g>
  <g>
    <rect x="30" y="160" width="220" height="50" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="140" y="182" text-anchor="middle">CardPayment</text>
    <line x1="30" y1="190" x2="250" y2="190" stroke="#333"/>
  </g>
  <g>
    <rect x="30" y="250" width="220" height="50" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="140" y="272" text-anchor="middle">BankTransferPayment</text>
    <line x1="30" y1="280" x2="250" y2="280" stroke="#333"/>
  </g>
  <line x1="140" y1="160" x2="140" y2="110" stroke="#333" stroke-width="1.5"/>
  <polygon points="140,110 130,124 150,124" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="140" y1="250" x2="140" y2="210" stroke="#333" stroke-width="1.5"/>
  <polygon points="140,210 130,224 150,224" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- PaymentService (factory method) -->
  <g>
    <rect x="330" y="40" width="420" height="110" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="540" y="62" text-anchor="middle" font-weight="bold">«Creator» (Фабричный метод)</text>
    <text x="540" y="82" text-anchor="middle" font-weight="bold">PaymentService</text>
    <line x1="330" y1="92" x2="750" y2="92" stroke="#333"/>
    <text x="340" y="112">+ initPayment(): Payment</text>
    <text x="340" y="134"># createPayment(): Payment  {abstract}</text>
  </g>
  <g>
    <rect x="330" y="190" width="200" height="60" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="430" y="214" text-anchor="middle">CardPaymentService</text>
    <line x1="330" y1="222" x2="530" y2="222" stroke="#333"/>
    <text x="340" y="240"># createPayment()</text>
  </g>
  <g>
    <rect x="560" y="190" width="190" height="60" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="655" y="214" text-anchor="middle">BankTransferPaymentService</text>
    <line x1="560" y1="222" x2="750" y2="222" stroke="#333"/>
    <text x="570" y="240"># createPayment()</text>
  </g>
  <line x1="430" y1="190" x2="480" y2="150" stroke="#333" stroke-width="1.5"/>
  <polygon points="480,150 468,158 480,164" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="655" y1="190" x2="610" y2="150" stroke="#333" stroke-width="1.5"/>
  <polygon points="610,150 622,158 622,166" fill="none" stroke="#333" stroke-width="1.5"/>

  <!-- creator -> product (creates) -->
  <line x1="330" y1="100" x2="255" y2="80" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="255,80 267,80 265,90" fill="#333"/>

  <!-- Abstract factory -->
  <g>
    <rect x="330" y="330" width="420" height="90" fill="#FDF6E3" stroke="#333" stroke-width="1.5"/>
    <text x="540" y="352" text-anchor="middle" font-weight="bold">«AbstractFactory»</text>
    <text x="540" y="372" text-anchor="middle" font-weight="bold">PaymentProviderFactory</text>
    <line x1="330" y1="382" x2="750" y2="382" stroke="#333"/>
    <text x="340" y="402">+ createValidator(): PaymentValidator</text>
    <text x="340" y="414">+ createFeeCalculator(): FeeCalculator</text>
  </g>
  <g>
    <rect x="330" y="470" width="200" height="55" fill="#FDF6E3" stroke="#333" stroke-width="1.5"/>
    <text x="430" y="492" text-anchor="middle">CardProviderFactory</text>
    <line x1="330" y1="500" x2="530" y2="500" stroke="#333"/>
  </g>
  <g>
    <rect x="560" y="470" width="190" height="55" fill="#FDF6E3" stroke="#333" stroke-width="1.5"/>
    <text x="655" y="492" text-anchor="middle">BankTransferProviderFactory</text>
    <line x1="560" y1="500" x2="750" y2="500" stroke="#333"/>
  </g>
  <line x1="430" y1="470" x2="480" y2="420" stroke="#333" stroke-width="1.5"/>
  <line x1="655" y1="470" x2="610" y2="420" stroke="#333" stroke-width="1.5"/>

  <!-- products of abstract factory -->
  <g>
    <rect x="30" y="350" width="220" height="55" fill="#F3E8FD" stroke="#333" stroke-width="1.5"/>
    <text x="140" y="372" text-anchor="middle">&#171;interface&#187;</text>
    <text x="140" y="390" text-anchor="middle">PaymentValidator</text>
  </g>
  <g>
    <rect x="30" y="450" width="220" height="55" fill="#F3E8FD" stroke="#333" stroke-width="1.5"/>
    <text x="140" y="472" text-anchor="middle">&#171;interface&#187;</text>
    <text x="140" y="490" text-anchor="middle">FeeCalculator</text>
  </g>
  <line x1="330" y1="385" x2="255" y2="378" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="330" y1="400" x2="255" y2="470" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
</svg>
