<svg xmlns="http://www.w3.org/2000/svg" font-family="Menlo, monospace" font-size="12.5" width="780" height="620" viewBox="0 0 780 620">
  <rect width="780" height="620" fill="#FFFFFF"/>

  <!-- Composite -->
  <text x="390" y="28" text-anchor="middle" font-weight="bold">Компоновщик</text>

  <g>
    <rect x="290" y="50" width="220" height="95" fill="#F3E8FD" stroke="#333" stroke-width="1.5"/>
    <text x="400" y="72" text-anchor="middle" font-weight="bold">&#171;Component&#187;</text>
    <text x="400" y="92" text-anchor="middle" font-weight="bold">PriceComponent</text>
    <line x1="290" y1="102" x2="510" y2="102" stroke="#333"/>
    <text x="300" y="118">+ label(): String</text>
    <text x="300" y="136">+ cost(): BigDecimal</text>
  </g>

  <!-- leaves -->
  <g>
    <rect x="30" y="200" width="170" height="55" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="115" y="224" text-anchor="middle">FlightFare</text>
    <line x1="30" y1="232" x2="200" y2="232" stroke="#333"/>
  </g>
  <g>
    <rect x="215" y="200" width="165" height="55" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="297" y="224" text-anchor="middle">BaggageOption</text>
    <line x1="215" y1="232" x2="380" y2="232" stroke="#333"/>
  </g>
  <g>
    <rect x="400" y="200" width="160" height="55" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="480" y="224" text-anchor="middle">MealOption</text>
    <line x1="400" y1="232" x2="560" y2="232" stroke="#333"/>
  </g>
  <g>
    <rect x="580" y="200" width="175" height="55" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="667" y="224" text-anchor="middle">InsuranceOption</text>
    <line x1="580" y1="232" x2="755" y2="232" stroke="#333"/>
  </g>

  <!-- composites -->
  <g>
    <rect x="80" y="330" width="230" height="105" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="195" y="352" text-anchor="middle" font-weight="bold">&#171;Composite&#187;</text>
    <text x="195" y="372" text-anchor="middle" font-weight="bold">BookingOrder</text>
    <line x1="80" y1="382" x2="310" y2="382" stroke="#333"/>
    <text x="90" y="398">- children: List&lt;Component&gt;</text>
    <text x="90" y="416">+ addComponent(c)</text>
    <text x="90" y="434">+ cost(): BigDecimal</text>
  </g>

  <g>
    <rect x="460" y="330" width="230" height="105" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="575" y="352" text-anchor="middle" font-weight="bold">&#171;Composite&#187;</text>
    <text x="575" y="372" text-anchor="middle" font-weight="bold">PassengerBlock</text>
    <line x1="460" y1="382" x2="690" y2="382" stroke="#333"/>
    <text x="470" y="398">- children: List&lt;Component&gt;</text>
    <text x="470" y="416">+ addComponent(c)</text>
    <text x="470" y="434">+ cost(): BigDecimal</text>
  </g>

  <!-- links: leaves to component -->
  <line x1="115" y1="200" x2="330" y2="145" stroke="#333" stroke-width="1.5"/>
  <line x1="297" y1="200" x2="375" y2="145" stroke="#333" stroke-width="1.5"/>
  <line x1="480" y1="200" x2="425" y2="145" stroke="#333" stroke-width="1.5"/>
  <line x1="667" y1="200" x2="470" y2="145" stroke="#333" stroke-width="1.5"/>
  <polygon points="400,145 414,151 406,161" fill="none" stroke="#333" stroke-width="1.5"/>
  <!-- composites to component -->
  <line x1="195" y1="330" x2="330" y2="145" stroke="#333" stroke-width="1.5"/>
  <line x1="575" y1="330" x2="450" y2="145" stroke="#333" stroke-width="1.5"/>
  <!-- self link children -->
  <path d="M 310 400 C 340 400 340 425 315 425" fill="none" stroke="#333" stroke-width="1.2"/>
  <polygon points="315,425 327,419 327,431" fill="none" stroke="#333" stroke-width="1.2"/>
  <path d="M 690 400 C 720 400 720 425 695 425" fill="none" stroke="#333" stroke-width="1.2"/>
  <polygon points="695,425 707,419 707,431" fill="none" stroke="#333" stroke-width="1.2"/>

  <!-- Decorator -->
  <text x="390" y="480" text-anchor="middle" font-weight="bold">Декоратор</text>

  <g>
    <rect x="60" y="500" width="200" height="80" fill="#F3E8FD" stroke="#333" stroke-width="1.5"/>
    <text x="160" y="522" text-anchor="middle" font-weight="bold">&#171;Interface&#187;</text>
    <text x="160" y="542" text-anchor="middle" font-weight="bold">FareComponent</text>
    <line x1="60" y1="552" x2="260" y2="552" stroke="#333"/>
    <text x="70" y="568">+ cost(): BigDecimal</text>
  </g>

  <g>
    <rect x="310" y="500" width="170" height="80" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="395" y="524" text-anchor="middle">BasicFare</text>
    <line x1="310" y1="532" x2="480" y2="532" stroke="#333"/>
  </g>

  <g>
    <rect x="530" y="500" width="220" height="100" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="640" y="522" text-anchor="middle" font-weight="bold">&#171;Decorator&#187;</text>
    <text x="640" y="542" text-anchor="middle" font-weight="bold">FareDecorator</text>
    <line x1="530" y1="552" x2="750" y2="552" stroke="#333"/>
    <text x="540" y="568"># inner: FareComponent</text>
    <text x="540" y="586">BaggageDecorator</text>
    <text x="540" y="598">InsuranceDecorator</text>
  </g>

  <line x1="260" y1="540" x2="310" y2="540" stroke="#333" stroke-width="1.5"/>
  <polygon points="260,540 272,534 272,546" fill="none" stroke="#333" stroke-width="1.5"/>
  <line x1="530" y1="540" x2="480" y2="540" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4"/>
  <polygon points="480,540 492,534 492,546" fill="none" stroke="#333" stroke-width="1.5"/>
</svg>
