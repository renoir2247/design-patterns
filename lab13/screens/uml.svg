<svg xmlns="http://www.w3.org/2000/svg" font-family="Menlo, monospace" font-size="12.5" width="760" height="310" viewBox="0 0 760 310">
  <rect width="760" height="310" fill="#FFFFFF"/>

  <g>
    <rect x="40" y="60" width="200" height="75" fill="#EEE" stroke="#333" stroke-width="1.5"/>
    <text x="140" y="84" text-anchor="middle" font-weight="bold">Client</text>
    <text x="140" y="104" text-anchor="middle" font-weight="bold">PaymentServiceImpl</text>
    <line x1="40" y1="112" x2="240" y2="112" stroke="#333"/>
    <text x="50" y="126">+ charge(txId)</text>
  </g>

  <g>
    <rect x="290" y="50" width="220" height="95" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="400" y="74" text-anchor="middle" font-weight="bold">&#171;CircuitBreaker&#187;</text>
    <text x="400" y="94" text-anchor="middle" font-weight="bold">CircuitBreaker</text>
    <line x1="290" y1="104" x2="510" y2="104" stroke="#333"/>
    <text x="300" y="120">- failures, failureThreshold</text>
    <text x="300" y="136">- open: boolean</text>
    <text x="300" y="152">+ charge(txId): String</text>
  </g>

  <g>
    <rect x="560" y="60" width="170" height="75" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="645" y="84" text-anchor="middle" font-weight="bold">&#171;Adaptee&#187;</text>
    <text x="645" y="104" text-anchor="middle" font-weight="bold">PaymentGateway</text>
    <line x1="560" y1="112" x2="730" y2="112" stroke="#333"/>
    <text x="570" y="126">+ charge(txId)</text>
  </g>

  <line x1="240" y1="97" x2="290" y2="97" stroke="#333" stroke-width="1.5"/>
  <polygon points="290,97 278,91 278,103" fill="#333"/>
  <line x1="510" y1="97" x2="560" y2="97" stroke="#333" stroke-width="1.5"/>
  <polygon points="560,97 548,91 548,103" fill="#333"/>
  <text x="535" y="87" text-anchor="middle">если CLOSED</text>

  <g>
    <rect x="180" y="200" width="400" height="80" fill="#FDF6E3" stroke="#333" stroke-width="1.5"/>
    <text x="380" y="224" text-anchor="middle" font-weight="bold">Состояния размыкателя</text>
    <line x1="180" y1="234" x2="580" y2="234" stroke="#333"/>
    <text x="190" y="252">CLOSED: пропускает вызовы, считает сбои</text>
    <text x="190" y="270">OPEN: отклоняет сразу; после паузы пробует снова</text>
  </g>
</svg>
