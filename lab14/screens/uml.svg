<svg xmlns="http://www.w3.org/2000/svg" font-family="Menlo, monospace" font-size="12.5" width="760" height="290" viewBox="0 0 760 290">
  <rect width="760" height="290" fill="#FFFFFF"/>

  <g>
    <rect x="40" y="60" width="220" height="80" fill="#FDF6E3" stroke="#333" stroke-width="1.5"/>
    <text x="150" y="84" text-anchor="middle" font-weight="bold">&#171;Model&#187;</text>
    <text x="150" y="104" text-anchor="middle" font-weight="bold">Booking</text>
    <line x1="40" y1="112" x2="260" y2="112" stroke="#333"/>
    <text x="50" y="128">- reference, status</text>
    <text x="50" y="144">+ confirm() {бизнес-правила}</text>
  </g>

  <g>
    <rect x="290" y="60" width="200" height="80" fill="#E8F0FE" stroke="#333" stroke-width="1.5"/>
    <text x="390" y="84" text-anchor="middle" font-weight="bold">&#171;Repository&#187;</text>
    <text x="390" y="104" text-anchor="middle" font-weight="bold">BookingRepository</text>
    <line x1="290" y1="112" x2="490" y2="112" stroke="#333"/>
    <text x="300" y="128">+ save / findByReference</text>
    <text x="300" y="144">+ findByStatus / count</text>
  </g>

  <g>
    <rect x="540" y="60" width="190" height="80" fill="#EDF7ED" stroke="#333" stroke-width="1.5"/>
    <text x="635" y="84" text-anchor="middle" font-weight="bold">InMemory&#8203;Repository</text>
    <line x1="540" y1="112" x2="730" y2="112" stroke="#333"/>
    <text x="550" y="128">- storage: List&lt;Booking&gt;</text>
    <text x="550" y="144">(или JPA-репозиторий)</text>
  </g>

  <line x1="260" y1="100" x2="290" y2="100" stroke="#333" stroke-width="1.5"/>
  <polygon points="290,100 278,94 278,106" fill="#333"/>
  <line x1="490" y1="100" x2="540" y2="100" stroke="#333" stroke-width="1.5"/>
  <polygon points="540,100 528,94 528,106" fill="none" stroke="#333" stroke-width="1.5"/>

  <text x="380" y="200" text-anchor="middle">сервисы и контроллеры зависят от интерфейса Repository,</text>
  <text x="380" y="220" text-anchor="middle">реализация хранения подменяется без изменения домена</text>
</svg>
